<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400" style="max-width:100%;height:auto" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">TasteLocal SG — Portfolio Architecture and Data Flow</title>
  <desc id="diagram-desc">A left-to-right architecture diagram showing Tourist, Vendor, and Administrator users; a React and Vite browser frontend; a Django REST Framework backend; optional Google Maps and Gemini integrations; recommendation validation and fallback; Django ORM; and MySQL.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#203247" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-core" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <marker id="arrow-optional" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .title { font: 700 38px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Inter, "Segoe UI", Arial, sans-serif; fill: #5b677a; }
      .zone { stroke-width: 2.5; rx: 24; }
      .zone-title { font: 700 23px Inter, "Segoe UI", Arial, sans-serif; letter-spacing: 0.3px; }
      .box { stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box-title { font: 700 22px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .box-copy { font: 400 18px Inter, "Segoe UI", Arial, sans-serif; fill: #405069; text-anchor: middle; }
      .small-copy { font: 400 15px Inter, "Segoe UI", Arial, sans-serif; fill: #405069; text-anchor: middle; }
      .arrow-label { font: 600 17px Inter, "Segoe UI", Arial, sans-serif; fill: #26364d; text-anchor: middle; }
      .arrow-label-small { font: 600 16px Inter, "Segoe UI", Arial, sans-serif; fill: #26364d; text-anchor: middle; }
      .core { fill: none; stroke: #334155; stroke-width: 3.5; marker-end: url(#arrow-core); stroke-linecap: round; stroke-linejoin: round; }
      .core-thin { fill: none; stroke: #475569; stroke-width: 2.7; marker-end: url(#arrow-core); stroke-linecap: round; stroke-linejoin: round; }
      .optional { fill: none; stroke: #64748b; stroke-width: 2.8; stroke-dasharray: 11 9; marker-end: url(#arrow-optional); stroke-linecap: round; stroke-linejoin: round; }
      .legend { font: 500 17px Inter, "Segoe UI", Arial, sans-serif; fill: #405069; }
    </style>
  </defs>

  <rect class="canvas" width="2200" height="1300"/>
  <text class="title" x="1100" y="56" text-anchor="middle">TasteLocal SG — Portfolio Architecture and Data Flow</text>
  <text class="subtitle" x="1100" y="88" text-anchor="middle">Role-based browser experience · secured REST API · validated recommendations · relational persistence</text>

  <!-- Optional external services -->
  <rect class="box" x="455" y="115" width="330" height="110" fill="#fff8e7" stroke="#d89a26"/>
  <text class="box-title" x="620" y="158">Google Maps JavaScript API</text>
  <text class="box-copy" x="620" y="190">Optional browser-side maps</text>

  <rect class="box" x="1300" y="115" width="320" height="110" fill="#fff8e7" stroke="#d89a26"/>
  <text class="box-title" x="1460" y="158">Gemini API</text>
  <text class="box-copy" x="1460" y="190">Optional recommendation provider</text>

  <!-- Zone containers -->
  <rect class="zone" x="35" y="270" width="305" height="965" fill="#f2f7ff" stroke="#7ba4d8"/>
  <text class="zone-title" x="65" y="312" fill="#315f96">Users</text>

  <rect class="zone" x="390" y="270" width="440" height="965" fill="#effcf7" stroke="#5da98b"/>
  <text class="zone-title" x="420" y="312" fill="#27735a">Frontend — Browser</text>

  <rect class="zone" x="890" y="270" width="770" height="965" fill="#f5f1ff" stroke="#8f77c5"/>
  <text class="zone-title" x="920" y="312" fill="#62489a">Backend — Application Server</text>

  <rect class="zone" x="1720" y="270" width="445" height="965" fill="#fff5f2" stroke="#d98267"/>
  <text class="zone-title" x="1750" y="312" fill="#a74d35">Data — Database</text>

  <!-- Users -->
  <rect class="box" x="70" y="380" width="235" height="135" fill="#ffffff" stroke="#7ba4d8"/>
  <text class="box-title" x="187.5" y="425">Tourist</text>
  <text class="box-copy" x="187.5" y="460">Discover · Book · Review</text>
  <text class="box-copy" x="187.5" y="486">Plan itinerary</text>

  <rect class="box" x="70" y="610" width="235" height="135" fill="#ffffff" stroke="#7ba4d8"/>
  <text class="box-title" x="187.5" y="655">Vendor</text>
  <text class="box-copy" x="187.5" y="690">Manage listings · Availability</text>
  <text class="box-copy" x="187.5" y="716">Booking decisions</text>

  <rect class="box" x="70" y="840" width="235" height="135" fill="#ffffff" stroke="#7ba4d8"/>
  <text class="box-title" x="187.5" y="885">Administrator</text>
  <text class="box-copy" x="187.5" y="920">Approve vendors</text>
  <text class="box-copy" x="187.5" y="946">Moderate platform records</text>

  <!-- Frontend -->
  <rect class="box" x="450" y="380" width="320" height="140" fill="#ffffff" stroke="#5da98b"/>
  <text class="box-title" x="610" y="430">React / Vite SPA</text>
  <text class="box-copy" x="610" y="466">User interface and</text>
  <text class="box-copy" x="610" y="492">application shell</text>

  <rect class="box" x="450" y="610" width="320" height="140" fill="#ffffff" stroke="#5da98b"/>
  <text class="box-title" x="610" y="660">React Router + Bootstrap</text>
  <text class="box-copy" x="610" y="696">Role-aware navigation</text>
  <text class="box-copy" x="610" y="722">and responsive UI</text>

  <rect class="box" x="450" y="840" width="320" height="140" fill="#ffffff" stroke="#5da98b"/>
  <text class="box-title" x="610" y="890">Axios API Client</text>
  <text class="box-copy" x="610" y="926">JSON requests</text>
  <text class="box-copy" x="610" y="952">JWT bearer tokens</text>

  <!-- Backend -->
  <rect class="box" x="930" y="380" width="300" height="155" fill="#ffffff" stroke="#8f77c5"/>
  <text class="box-title" x="1080" y="424">Django +</text>
  <text class="box-title" x="1080" y="450">Django REST Framework</text>
  <text class="box-copy" x="1080" y="488">REST endpoints and</text>
  <text class="box-copy" x="1080" y="514">business logic</text>

  <rect class="box" x="1320" y="380" width="300" height="155" fill="#ffffff" stroke="#8f77c5"/>
  <text class="box-title" x="1470" y="430">Recommendation Service</text>
  <text class="box-copy" x="1470" y="470">Backend-only Gemini</text>
  <text class="box-copy" x="1470" y="496">orchestration</text>

  <rect class="box" x="930" y="790" width="300" height="165" fill="#ffffff" stroke="#8f77c5"/>
  <text class="box-title" x="1080" y="834">Authentication and</text>
  <text class="box-title" x="1080" y="860">Permissions</text>
  <text class="box-copy" x="1080" y="895">JWT authentication</text>
  <text class="small-copy" x="1080" y="922">Role · Vendor approval</text>
  <text class="small-copy" x="1080" y="946">Ownership checks</text>

  <rect class="box" x="1320" y="760" width="300" height="215" fill="#ffffff" stroke="#8f77c5"/>
  <text class="box-title" x="1470" y="807">Recommendation Safety</text>
  <text class="box-title" x="1470" y="833">and Fallback</text>
  <text class="box-copy" x="1470" y="875">Validate IDs against</text>
  <text class="box-copy" x="1470" y="901">public records</text>
  <text class="box-copy" x="1470" y="939">Deterministic catalogue fallback</text>

  <!-- Data -->
  <rect class="box" x="1770" y="760" width="345" height="175" fill="#ffffff" stroke="#d98267"/>
  <text class="box-title" x="1942.5" y="820">Django ORM</text>
  <text class="box-copy" x="1942.5" y="863">Model queries and</text>
  <text class="box-copy" x="1942.5" y="893">persistence</text>

  <rect class="box" x="1770" y="1035" width="345" height="165" fill="#ffffff" stroke="#d98267"/>
  <text class="box-title" x="1942.5" y="1082">MySQL</text>
  <text class="box-copy" x="1942.5" y="1122">Users · Experiences</text>
  <text class="box-copy" x="1942.5" y="1150">Availability · Bookings</text>
  <text class="box-copy" x="1942.5" y="1178">Reviews · Itinerary</text>

  <!-- User interaction arrows -->
  <path class="core" d="M305 447 C355 447 390 440 450 440"/>
  <text class="arrow-label" x="376" y="421">Uses browser UI</text>

  <path class="core" d="M305 677 C365 677 372 470 450 470"/>
  <text class="arrow-label" x="365" y="582">Uses browser UI</text>

  <path class="core" d="M305 907 C375 907 375 495 450 495"/>
  <text class="arrow-label" x="358" y="770">Uses browser UI</text>

  <!-- Frontend internal arrows -->
  <path class="core-thin" d="M610 520 L610 610"/>
  <text class="arrow-label" x="610" y="568">Renders role workflows</text>

  <path class="core-thin" d="M610 750 L610 840"/>
  <text class="arrow-label" x="610" y="798">Triggers data operations</text>

  <!-- Axios and REST request/response -->
  <path class="core" d="M770 900 H845 V455 H930"/>
  <text class="arrow-label-small" x="830" y="678" transform="rotate(-90 830 678)">JSON over REST · JWT bearer token</text>

  <path class="core-thin" d="M930 495 H870 V930 H770"/>
  <text class="arrow-label-small" x="886" y="688" transform="rotate(-90 886 688)">JSON response · status and data</text>

  <!-- Authentication and authorization -->
  <path class="core-thin" d="M1052 535 V790"/>
  <text class="arrow-label" x="997" y="660" transform="rotate(-90 997 660)">Authenticate and authorize</text>

  <path class="core-thin" d="M1108 790 V535"/>
  <text class="arrow-label" x="1160" y="660" transform="rotate(-90 1160 660)">Allow or reject request</text>

  <!-- Main backend to ORM flow -->
  <path class="core" d="M1230 505 V650 H1735 V805 H1770"/>
  <text class="arrow-label" x="1475" y="633">Business operations and queries</text>

  <!-- Recommendation flow -->
  <path class="core-thin" d="M1230 430 H1320"/>
  <text class="arrow-label-small" x="1275" y="355">Recommendation query</text>

  <path class="optional" d="M1470 380 V225"/>
  <text class="arrow-label-small" x="1360" y="243">Backend-only request</text>
  <text class="arrow-label-small" x="1360" y="264">when configured</text>

  <path class="optional" d="M1600 185 H1685 V865 H1620"/>
  <text class="arrow-label-small" x="1704" y="525" transform="rotate(-90 1704 525)">Candidate IDs and explanation</text>

  <path class="core-thin" d="M1470 535 V760"/>
  <text class="arrow-label-small" x="1380" y="575">Unavailable / invalid</text>
  <text class="arrow-label-small" x="1380" y="599">or unusable → deterministic fallback</text>

  <path class="core-thin" d="M1320 905 H1265 V500 H1230"/>
  <text class="arrow-label-small" x="1280" y="694" transform="rotate(-90 1280 694)">Validated recommendations + fallback status</text>

  <!-- Recommendation validation against public records -->
  <path class="core-thin" d="M1620 820 H1770"/>
  <text class="arrow-label-small" x="1695" y="792">Check public records</text>

  <path class="core-thin" d="M1770 900 H1620"/>
  <text class="arrow-label-small" x="1695" y="930">Validated catalogue records</text>

  <!-- ORM and MySQL -->
  <path class="core" d="M1918 935 V1035"/>
  <text class="arrow-label-small" x="1863" y="987" transform="rotate(-90 1863 987)">SQL reads and writes</text>

  <path class="core-thin" d="M1972 1035 V935"/>
  <text class="arrow-label-small" x="2027" y="987" transform="rotate(-90 2027 987)">Persisted records</text>

  <!-- Optional Google Maps flow -->
  <path class="optional" d="M760 380 V225"/>
  <text class="arrow-label-small" x="815" y="286">Load optional map</text>
  <text class="arrow-label-small" x="815" y="308">and location view</text>

  <path class="optional" d="M700 225 V380"/>
  <text class="arrow-label-small" x="635" y="244">Map rendering</text>
  <text class="arrow-label-small" x="635" y="266">services</text>

  <!-- Legend -->
  <rect x="530" y="1270" width="1140" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="legend" x="560" y="1306" font-weight="700">Legend</text>
  <line x1="660" y1="1302" x2="750" y2="1302" stroke="#334155" stroke-width="3.5" marker-end="url(#arrow-core)"/>
  <text class="legend" x="775" y="1308">Core application flow</text>
  <line x1="1010" y1="1302" x2="1100" y2="1302" stroke="#64748b" stroke-width="2.8" stroke-dasharray="11 9" marker-end="url(#arrow-optional)"/>
  <text class="legend" x="1125" y="1308">Optional external integration</text>
  <rect x="1435" y="1283" width="50" height="36" rx="8" fill="#f8fafc" stroke="#8f77c5" stroke-width="2"/>
  <text class="legend" x="1505" y="1308">Execution boundary</text>
  <text class="small-copy" x="1100" y="1346">Solid paths are core flows; dashed paths call optional external services.</text>
</svg>
